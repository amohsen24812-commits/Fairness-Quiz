<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff5c9a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fair or Not">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Fair or Not Fair?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: cheerful playground game, big and friendly for kids
IDEA: a real balance scale on a classroom poster
PICTURE: the scale tips to the side you choose, then shows if you were right
COLOUR and TYPE: bubblegum pink ground, deep plum ink, green FAIR, red NOT FAIR, sunny gold for points; Fredoka
LAYOUT: one column: score bar, scale, question card, two big buttons
*/
:root{color-scheme:light dark;
--bg:light-dark(#ffe6f0,#2a0f22);--card:light-dark(#ffffff,#3d1832);--ink:light-dark(#3a0d2e,#ffe6f0);
--soft:light-dark(#8a4a74,#e9b6d3);--pink:#ff5c9a;--fair:#1f9d55;--fairD:#157a41;--no:#e0303a;--noD:#b0202a;--gold:#ffb703;
--line:light-dark(#f7c3d9,#5a2449)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Fredoka,"Comic Sans MS",system-ui,sans-serif;overflow-x:clip;min-height:100vh;
background-image:radial-gradient(circle at 10% 15%,light-dark(#ffd1e3,#3a1530) 0 60px,transparent 61px),radial-gradient(circle at 92% 70%,light-dark(#ffd1e3,#3a1530) 0 90px,transparent 91px)}
main{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
h1{margin:4px 0 0;font-size:clamp(32px,8vw,46px);line-height:1.05;text-align:center;font-weight:700;text-wrap:balance}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:600;font-size:16px;white-space:nowrap}
.pill b{color:var(--pink)}
.points b{color:#c98a00}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--fair)}.dot.bad{background:var(--no)}.dot.now{outline:3px solid var(--pink);outline-offset:2px}
.stage{position:relative;height:200px}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#beam{transform-origin:200px 70px;transition:transform .6s cubic-bezier(.4,1.6,.5,1)}
.pan{transition:transform .6s cubic-bezier(.4,1.6,.5,1)}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:20px 20px;box-shadow:0 6px 0 var(--line)}
#q{margin:0;font-size:clamp(20px,5vw,26px);line-height:1.3;font-weight:600;text-align:center;text-wrap:balance;min-height:3.9em;display:flex;align-items:center;justify-content:center}
.btns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
button{font:inherit;font-weight:700;font-size:21px;min-height:64px;border:none;border-radius:18px;color:#fff;cursor:pointer;
transition:transform .1s,box-shadow .1s;letter-spacing:.5px}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
button:active{transform:translateY(4px)}
.fair{background:var(--fair);box-shadow:0 6px 0 var(--fairD)}
.notfair{background:var(--no);box-shadow:0 6px 0 var(--noD)}
.fair:active{box-shadow:0 2px 0 var(--fairD)}.notfair:active{box-shadow:0 2px 0 var(--noD)}
button:disabled{opacity:.55;cursor:default;transform:none}
.big{background:var(--pink);box-shadow:0 6px 0 #c93a72;width:100%}
#result{min-height:5.2em;text-align:center;border-radius:18px;padding:12px 14px;font-size:18px;display:flex;flex-direction:column;justify-content:center;gap:2px}
#result strong{font-size:22px}
#result.ok{background:light-dark(#dcf6e6,#163a26);color:light-dark(#0f5a30,#a8f0c4)}
#result.bad{background:light-dark(#ffe0e2,#4a1a1e);color:light-dark(#8e1a22,#ffc2c6)}
#result:empty{visibility:hidden}
.plus{position:fixed;left:50%;top:42%;transform:translate(-50%,0);font-size:44px;font-weight:700;color:#c98a00;pointer-events:none;
text-shadow:0 3px 0 #fff;animation:up 1.1s ease-out forwards}
@keyframes up{to{transform:translate(-50%,-90px);opacity:0}}
.end{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.end h2{margin:0;font-size:clamp(30px,7vw,40px);line-height:1.1}
.end p{margin:0;font-size:19px;color:var(--soft)}
.stars{display:flex;gap:8px;justify-content:center}
.stars svg{width:54px;height:54px}
.hidden{display:none!important}
small{display:block;text-align:center;color:var(--soft);font-size:14px}
@media(prefers-reduced-motion:reduce){#beam,.pan{transition:none}.plus{animation:none;opacity:0}}
@media(max-width:400px){button{font-size:18px}.stage{height:170px}}
</style>
</head>
<body>
<main>
  <h1>Fair or Not Fair?</h1>

  <div class="bar">
    <span class="pill">Question <b id="num">1</b> of <b id="total">8</b></span>
    <span class="pill points">Points: <b id="score">0</b></span>
  </div>
  <div class="dots" id="dots" aria-hidden="true"></div>

  <div class="stage" aria-hidden="true">
    <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="gold" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#e09b00"/></linearGradient>
      </defs>
      <ellipse cx="200" cy="188" rx="80" ry="9" fill="#000" opacity=".12"/>
      <rect x="150" y="172" width="100" height="16" rx="8" fill="url(#gold)"/>
      <rect x="193" y="70" width="14" height="106" rx="7" fill="url(#gold)"/>
      <g id="beam">
        <rect x="60" y="64" width="280" height="12" rx="6" fill="url(#gold)"/>
        <rect x="60" y="64" width="280" height="4" rx="2" fill="#fff" opacity=".5"/>
        <g class="pan" id="panL">
          <line x1="80" y1="70" x2="50" y2="130" stroke="#c98a00" stroke-width="3"/>
          <line x1="80" y1="70" x2="110" y2="130" stroke="#c98a00" stroke-width="3"/>
          <path d="M40 130 h80 a40 22 0 0 1 -80 0z" fill="var(--fair)"/>
          <text x="80" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="Fredoka,sans-serif">FAIR</text>
        </g>
        <g class="pan" id="panR">
          <line x1="320" y1="70" x2="290" y2="130" stroke="#c98a00" stroke-width="3"/>
          <line x1="320" y1="70" x2="350" y2="130" stroke="#c98a00" stroke-width="3"/>
          <path d="M280 130 h80 a40 22 0 0 1 -80 0z" fill="var(--no)"/>
          <text x="320" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="Fredoka,sans-serif">NOT FAIR</text>
        </g>
      </g>
      <circle cx="200" cy="70" r="13" fill="var(--pink)" stroke="#fff" stroke-width="3"/>
    </svg>
  </div>

  <section id="play">
    <div class="card"><h2 id="q" aria-live="polite">Loading…</h2></div>
    <div class="btns" style="margin-top:16px">
      <button class="fair" id="bFair">FAIR</button>
      <button class="notfair" id="bNot">NOT FAIR</button>
    </div>
    <div id="result" style="margin-top:16px" aria-live="polite"></div>
    <button class="big hidden" id="next">Next question</button>
  </section>

  <section id="end" class="card end hidden">
    <div class="stars" id="stars"></div>
    <h2 id="endTitle">Game finished!</h2>
    <p id="endText"></p>
    <button class="big" id="again" style="margin-top:8px">Play again</button>
  </section>

  <button class="big hidden" id="install" style="background:#3a0d2e;box-shadow:0 6px 0 #1c0516">Install the app</button>
  <small>Every right answer earns 5 points.</small>
</main>

<script>
{
const questions = [
  {q:"Two students do a group project. One does all the work, the other does nothing. The teacher gives BOTH the same grade.", a:"notfair", why:"The one who did the work deserves more credit."},
  {q:"Your friend shares his sandwich with you because you forgot yours.", a:"fair", why:"Sharing with someone who needs help is kind and fair."},
  {q:"The teacher lets only boys play football at break.", a:"notfair", why:"Girls should get the same chance to play."},
  {q:"Everyone gets the same time to finish the exam.", a:"fair", why:"Same rules for everyone."},
  {q:"You take turns on the swing, and everyone gets 5 minutes.", a:"fair", why:"Taking turns gives everyone a chance."},
  {q:"A student cuts to the front of the lunch line because he is hungry.", a:"notfair", why:"Everyone is hungry. Waiting your turn is fair."},
  {q:"Your little brother gets help with his homework because it is hard for him.", a:"fair", why:"Fair means everyone gets what they need."},
  {q:"Only the kids with new shoes are allowed to join the race.", a:"notfair", why:"Shoes don't decide who can run."}
];
const POINTS = 5;
let i = 0, score = 0, results = [], locked = false;
const $ = id => document.getElementById(id);
const beam = $('beam'), panL = $('panL'), panR = $('panR');

function tilt(side){
  const deg = side==='fair' ? -12 : side==='notfair' ? 12 : 0;
  beam.style.transform = `rotate(${deg}deg)`;
  // keep pans hanging straight down
  panL.style.transform = `rotate(${-deg}deg)`; panL.style.transformOrigin = '80px 70px';
  panR.style.transform = `rotate(${-deg}deg)`; panR.style.transformOrigin = '320px 70px';
}

function drawDots(){
  $('dots').innerHTML = questions.map((_,k)=>{
    const c = results[k]===true?'ok':results[k]===false?'bad':(k===i?'now':'');
    return `<span class="dot ${c}"></span>`;
  }).join('');
}

function show(){
  locked = false;
  $('q').textContent = questions[i].q;
  $('num').textContent = i+1;
  $('result').textContent = ''; $('result').className = '';
  $('next').classList.add('hidden');
  $('bFair').disabled = $('bNot').disabled = false;
  tilt(null); drawDots();
}

function check(ans){
  if(locked) return; locked = true;
  const item = questions[i], right = ans===item.a;
  results[i] = right;
  tilt(ans);
  $('bFair').disabled = $('bNot').disabled = true;
  const r = $('result');
  const label = item.a==='fair' ? 'FAIR' : 'NOT FAIR';
  if(right){
    score += POINTS; $('score').textContent = score;
    r.className = 'ok';
    r.innerHTML = `<strong>Correct! +${POINTS} points</strong><span>It is ${label}. ${item.why}</span>`;
    const p = document.createElement('div'); p.className='plus'; p.textContent = '+'+POINTS;
    document.body.appendChild(p); setTimeout(()=>p.remove(),1200);
  } else {
    r.className = 'bad';
    r.innerHTML = `<strong>Oops! The answer is ${label}</strong><span>${item.why}</span>`;
  }
  drawDots();
  const n = $('next');
  n.textContent = i < questions.length-1 ? 'Next question' : 'See my score';
  n.classList.remove('hidden'); n.style.marginTop='14px'; n.focus();
}

function next(){
  i++;
  if(i < questions.length) show(); else finish();
}

function star(on){
  return `<svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21.1l1.5-7L2 9.3l7-.8z" fill="${on?'#ffb703':'var(--line)'}" stroke="${on?'#c98a00':'none'}" stroke-width="1"/></svg>`;
}

function finish(){
  const max = questions.length*POINTS, right = results.filter(Boolean).length;
  const n = right===questions.length ? 3 : right >= questions.length*0.6 ? 2 : right>0 ? 1 : 0;
  $('play').classList.add('hidden'); $('end').classList.remove('hidden');
  $('stars').innerHTML = [0,1,2].map(k=>star(k<n)).join('');
  $('endTitle').textContent = n===3 ? 'Game finished! You are great!' : n===2 ? 'Great job!' : 'Good try!';
  $('endText').textContent = `You got ${right} of ${questions.length} right and earned ${score} of ${max} points.`;
  $('num').textContent = questions.length;
  tilt(null); drawDots();
}

function restart(){
  i=0; score=0; results=[]; $('score').textContent=0;
  $('end').classList.add('hidden'); $('play').classList.remove('hidden');
  show();
}

$('bFair').addEventListener('click',()=>check('fair'));
$('bNot').addEventListener('click',()=>check('notfair'));
$('next').addEventListener('click',next);
$('again').addEventListener('click',restart);
document.addEventListener('keydown',e=>{
  if(!$('play').classList.contains('hidden')){
    if(!locked && (e.key==='f'||e.key==='ArrowLeft')) check('fair');
    else if(!locked && (e.key==='n'||e.key==='ArrowRight')) check('notfair');
  }
});
$('total').textContent = questions.length;
show();

// Install as an app + work offline
try{
  if('serviceWorker' in navigator && location.protocol==='https:'){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}catch(e){}
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferred=e; $('install').classList.remove('hidden');
});
$('install').addEventListener('click',async()=>{
  if(!deferred) return;
  deferred.prompt(); try{await deferred.userChoice;}catch(e){}
  deferred=null; $('install').classList.add('hidden');
});
window.addEventListener('appinstalled',()=>$('install').classList.add('hidden'));
}
</script>
</body>
</html>
